    <h2>AIで作ったあとが、本番です</h2>
    <p>AIは、隙間を埋めるパートナーです。使い方がわからないところからでも、一緒にやれます。</p>
    <h3>AIは、隙間を埋めるパートナー</h3><p>人の代わりではありません。毎月の転記、確認、まとめ——人がやらなくていい隙間を、AIが埋めます。</p><h3>使い方がわからなくても、大丈夫です</h3><p>AIの使い方がわからない企業も、サポートします。道具の名前から始めなくて大丈夫です。今の仕事のどこが面倒かから、一緒に見ます。</p><h3>作ったあと、わかる人が残ります</h3><p>思い通りに動くことも、動かないこともあります。中身がわからないまま置くと、保守が止まります。私たちはそばに残ります。</p>
    <h3>マニュアルがなくても、現場のスタッフが使えますか？</h3><p>使えます。難しい画面は作りません。「いつものExcelが、ボタン一つで終わる」が目標です。初日のレクチャーも込みです。それでも不安なら、相談のときに実際の画面を見ながら確認しましょう。</p><h3>指定のExcelフォーマットを、変えずに使えますか？</h3><p>そこが一番のこだわりです。様式を作り直すより、今のファイルに合わせます。動くかどうかは、お試しで一緒に確認できます。</p><h3>解約やプラン変更は、融通が利きますか？</h3><p>小さく始めて、合わなければ縮小できます。最初から大きく契約させるつもりはありません。長く使ってもらう方が、こちらも楽だからです。</p><h3>相談したら、営業の電話がしつこくなりませんか？</h3><p>なりません。売り込みの電話はしません。続きが必要なら、その場で次の約束を取るだけです。</p><h3>うちの規模でも、お願いできますか？</h3><p>士業事務所、介護・医療の現場、中小企業が中心です。大企業向けのパッケージ売りではありません。「毎月の泥臭い作業」があるなら、話を聞く価値はあります。</p><h3>AIで作ったシステムでも、見てもらえますか？</h3><p>見ます。思い通りに動いているものも、止まっているものもあります。中身がわからないまま置いてあるなら、まず一緒に整理しましょう。作った人の名前は問いません。</p><h3>AIの使い方がわからなくても、相談できますか？</h3><p>できます。道具の名前から始めなくて大丈夫です。「毎月これが面倒」から話してください。AIは隙間を埋めるパートナーです。使い方も含めて、そばで見ます。</p><h3>相談する前に、試せますか？</h3><p>できます。無料体験のページに、持ち物チェックやPDF変換など、先に触れるミニアプリがあります。法人向けの仕組みとは別です。Googleアカウントでログインします。</p>
