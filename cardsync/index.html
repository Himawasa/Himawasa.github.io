    <h1>いつもの名簿から、そのままカードを。</h1>
    <p>Excel や CSV の名簿と顔写真の ZIP をドラッグ＆ドロップするだけで、社員証・来訪者証・立入許可証をブラウザ上で発行できます。署名つき QR で、スマートフォンから本物かを確認できます。登録不要でお試しいただけます。</p>

    <h2>できること</h2><p>Excel（.xlsx）や CSV の名簿をそのまま読み込めます。Shift_JIS も自動で判別し、和暦の日付や通し番号の自動採番にも対応します。</p><p>顔写真は「社員番号.jpg」のようにファイル名を付けて ZIP にまとめると、全員分が自動で配置されます。</p><p>実寸 85.6 × 54 mm・300dpi / 600dpi で、表裏の仕上がりを確認してから、社内のプリンタまたは PDF で発行できます。</p><h2>用途に合わせて選べる、3つの見本</h2><p>社員証・職員証／来訪者証／立入許可証。社名・配色・ロゴ・項目の位置は画面の上で調整できます。</p><p><a href="https://card.himawasa-sync.com">登録不要で体験してみる（無料）</a></p><h2>よくあるご質問</h2><h3>社員証を作るのに、専用のソフトは必要ですか？</h3><p>必要ありません。ブラウザだけで、名簿の取り込みからデザイン、発行までを行えます。インストールも、アカウント登録も不要です。</p><h3>いま使っている Excel の名簿を、そのまま使えますか？</h3><p>そのままお使いいただけます。Excel（.xlsx）と CSV に対応し、文字化けしやすい Shift_JIS のファイルも自動で判別します。和暦の日付や、EMP-0001 のような通し番号の自動採番にも対応しています。</p><h3>顔写真は、一人ずつ登録しないといけませんか？</h3><p>一括で登録できます。「社員番号.jpg」のように名簿の値をファイル名にした写真を ZIP にまとめて置くと、全員分が自動でそれぞれのカードに配置されます。</p><h3>顔写真は、あらかじめ切り抜いておく必要がありますか？</h3><p>必要ありません。取り込むときに顔を見つけて、証明写真の決まり（頭の大きさ・目の高さ）に合わせて自動で切りそろえます。スマートフォンで撮ったままの写真で構いません。縦向きで撮った写真の向きも自動で直します。切るだけで引き伸ばしはしないため、お顔の形が変わることはありません。顔が見つからない写真や、すでに証明写真になっているものは、無理に切らずそのまま取り込みます。</p><h3>どんなカードプリンタで印刷できますか？</h3><p>実寸（85.6 × 54 mm）で印刷できるプリンタであればお使いいただけます。印刷の細かさは 300dpi と 600dpi から選べるため、600dpi の再転写プリンタでもその細かさのまま出力できます。PDF に保存して、印刷を外部に依頼することもできます。</p><h3>来訪者証や、立入許可証も作れますか？</h3><p>作れます。社員証・来訪者証・立入許可証の3種類の見本が用意されており、社名・配色・項目の位置を画面の上で調整できます。表と裏の両面に対応しています。</p><h3>カードの偽造が心配です。見分けられますか？</h3><p>カードの裏面に、署名入りの QR コードを印刷できます。スマートフォンの標準のカメラで読み取ると、本当に発行されたカードか、有効期限内かがその場で分かります。専用アプリは不要です。QR の中身を書き換えると「確かめられませんでした」と表示されます。退職された方や紛失したカードは、名簿から削除すれば「すでに使われていません」に変わります。なお、本物の QR をそのまま複製したカードは、名簿に残っているあいだは有効と表示されますので、紛失時は名簿からの削除をお願いします。QR の中身に氏名は書いていません。</p><h3>体験で入力したデータは、どうなりますか？</h3><p>24時間後に自動で消去されます。ほかの方から見えることもありません。なお、体験では実在する方の氏名や顔写真の登録はお控えください。</p><h3>個人情報を外部のクラウドに置きたくないのですが。</h3><p>社内のネットワークだけで動かす構成もご用意できます。PostgreSQL を同梱した一式をお渡しし、社内のパソコンだけで完結させられます。導入をご検討の際にご相談ください。</p>
