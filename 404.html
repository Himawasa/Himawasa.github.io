    <h3>マニュアルがなくても、現場のスタッフが使えますか？</h3><p>使えます。難しい画面は作りません。「いつものExcelが、ボタン一つで終わる」が目標です。初日のレクチャーも込みです。それでも不安なら、相談のときに実際の画面を見ながら確認しましょう。</p><h3>指定のExcelフォーマットを、変えずに使えますか？</h3><p>そこが一番のこだわりです。様式を作り直すより、今のファイルに合わせます。動くかどうかは、お試しで一緒に確認できます。</p><h3>解約やプラン変更は、融通が利きますか？</h3><p>小さく始めて、合わなければ縮小できます。最初から大きく契約させるつもりはありません。長く使ってもらう方が、こちらも楽だからです。</p><h3>相談したら、営業の電話がしつこくなりませんか？</h3><p>なりません。売り込みの電話はしません。続きが必要なら、その場で次の約束を取るだけです。</p><h3>うちの規模でも、お願いできますか？</h3><p>士業事務所、介護・医療の現場、中小企業が中心です。大企業向けのパッケージ売りではありません。「毎月の泥臭い作業」があるなら、話を聞く価値はあります。</p>
