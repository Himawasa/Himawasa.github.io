<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>経費撮影アプリは移転いたしました</title>
<link rel="canonical" href="https://empazy-inc.digisapo-dx.com/app/" />
<!-- 下の script が動かないときの予備（3秒後に移る） -->
<meta http-equiv="refresh" content="3; url=https://empazy-inc.digisapo-dx.com/app/" />
<script>
  // 経費撮影アプリは 2026-10-31 に移転した（専用ページの中の /app/ へ）。
  // スマホに残っている古いアプリの登録（Service Worker）と保存済みの画面ファイルを消してから移る。消し終わらなくても 1.5 秒で移る
  (function () {
    var to = "https://empazy-inc.digisapo-dx.com/app/";
    var go = function () { location.replace(to); };
    if (!("serviceWorker" in navigator)) { go(); return; }
    var timer = setTimeout(go, 1500);
    var clearCaches = ("caches" in window)
      ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
      : Promise.resolve();
    navigator.serviceWorker.getRegistrations()
      .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); }).concat([clearCaches])); })
      .catch(function () {})
      .then(function () { clearTimeout(timer); go(); });
  })();
</script>
</head>
<body>
<p>経費撮影アプリは、移転いたしました。自動で切り替わらない場合は、<a href="https://empazy-inc.digisapo-dx.com/app/">移転先のページ（経費撮影）</a>へお進みください。</p>
</body>
</html>
