    <h2>マニュアルがなくても、現場のスタッフが使えますか？</h2><p>使えます。難しい画面は作りません。「いつものExcelが、ボタン一つで終わる」が目標です。初日のレクチャーも込みです。それでも不安なら、相談のときに実際の画面を見ながら確認しましょう。</p><h2>指定のExcelフォーマットを、変えずに使えますか？</h2><p>そこが一番のこだわりです。様式を作り直すより、今のファイルに合わせます。動くかどうかは、お試しで一緒に確認できます。</p><h2>解約やプラン変更は、融通が利きますか？</h2><p>小さく始めて、合わなければ縮小できます。最初から大きく契約させるつもりはありません。長く使ってもらう方が、こちらも楽だからです。</p><h2>相談したら、営業の電話がしつこくなりませんか？</h2><p>なりません。売り込みの電話はしません。続きが必要なら、その場で次の約束を取るだけです。</p><h2>うちの規模でも、お願いできますか？</h2><p>士業事務所、介護・医療の現場、中小企業が中心です。大企業向けのパッケージ売りではありません。「毎月の泥臭い作業」があるなら、話を聞く価値はあります。</p><h2>AIで作ったシステムでも、見てもらえますか？</h2><p>見ます。思い通りに動いているものも、止まっているものもあります。中身がわからないまま置いてあるなら、まず一緒に整理しましょう。作った人の名前は問いません。</p><h2>AIの使い方がわからなくても、相談できますか？</h2><p>できます。道具の名前から始めなくて大丈夫です。「毎月これが面倒」から話してください。AIは隙間を埋めるパートナーです。使い方も含めて、そばで見ます。</p><h2>相談する前に、試せますか？</h2><p>できます。無料体験のページに、持ち物チェックやPDF変換など、先に触れるミニアプリがあります。法人向けの仕組みとは別です。Googleアカウントでログインします。</p>
