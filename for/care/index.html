    <h2>ひとことで言うと</h2><p>HiMaWaSa Syncは、介護施設のシフト表と病院の日計転記を、今のExcelのまま自動化する個人事業です。</p><p>シフトはKING OF TIMEなどの勤怠データから、施設指定の様式へ載せます。病院は、人が画面やCSVで出している範囲だけを転記します。金額の確定は人のままです。</p><p>初回相談は無料・30分。売り込みの電話はしません。キーエンスRKは必須ではありません。入っている現場だけ、シナリオ作成を補助します。</p><h2>持ち物チェック</h2><p>写真から、必要なものを一覧に。 紙の目視確認を、もっと軽く。</p><h2>シフト表づくり</h2><p>勤怠データを、指定のExcel様式へ。 手入力の残業を減らします。</p><h2>施設のカレンダー</h2><p>予定・往診・残薬を、一つの画面に。 「言った・聞いていない」を減らす。</p><h2>日計・収入の転記</h2><p>電子カルテや医事ソフトから出した数字を、指定の日計Excelへ。確認は人のままです。</p><h2>夜間のCSV抜き出し</h2><p>カルテが空く時間に統計を取り、翌朝のたたき台を置いておく。</p><h2>複数拠点のExcel統合</h2><p>病院ごと・科ごとの野良ファイルを、本部の1枚へ。</p><p><a href="/Guide/care/">施設で改善できること</a> — 持ち物・シフト・予定・常勤換算・チラシなど、一覧で見る。</p><p><a href="/shiftsync/">介護のシフト表自動化</a> — KING OF TIMEの実績から、今の勤務表様式へ。</p><p><a href="/medical-dx/">病院・医療機関のDX</a> — FAX、カルテ、日計、画像。現場で動かしてきた道具。</p><p><a href="/rk/care/">RKが入っている施設は</a> — 補助です。勤怠→シフトのシナリオ作成だけ。</p><h3>KING OF TIMEのデータを、今のシフト表のまま使えますか？</h3><p>使えます。画面を見ながらの手入力をやめて、指定のExcel様式へ自動で載せます。例として、5時間かかっていた作業が3分になった現場があります。</p><h3>病院の日計やカルテの転記も頼めますか？</h3><p>頼めます。人が今、画面やCSVで出している範囲だけです。金額の確定は医事の人のままです。詳しくは医療機関向けの事例もご覧ください。</p><h3>現場の職員でも使えますか？</h3><p>使えます。難しい画面は作りません。初日のレクチャーも含みます。</p><h3>実地指導の記録にも使えますか？</h3><p>今ある記録を、必要な形で出しやすくします。記録の作り方を施設に押し付けることはしません。</p><h3>キーエンスRKも必要ですか？</h3><p>必須ではありません。今のExcelと勤怠ソフトのままで足りることが多いです。RKが入っている現場だけ、シナリオ作成を補助で受けます。</p>
