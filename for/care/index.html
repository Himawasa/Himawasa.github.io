    <h2>持ち物チェック</h2><p>写真から、必要なものを一覧に。 紙の目視確認を、もっと軽く。</p><h2>シフト表づくり</h2><p>勤怠データを、指定のExcel様式へ。 手入力の残業を減らします。</p><h2>施設のカレンダー</h2><p>予定・往診・残薬を、一つの画面に。 「言った・聞いていない」を減らす。</p><p><a href="/shiftsync/">ShiftSync</a> — KING OF TIME連携の、勤務表の自動作成。</p><p><a href="/medical-dx/">医療DXの事例</a> — FAX、カルテ、画像。現場で動かしてきた道具。</p><h3>KING OF TIMEのデータを、今のシフト表のまま使えますか？</h3><p>使えます。画面を見ながらの手入力をやめて、指定のExcel様式へ自動で載せます。例として、5時間かかっていた作業が3分になった現場があります。</p><h3>現場の職員でも使えますか？</h3><p>使えます。難しい画面は作りません。初日のレクチャーも含みます。</p><h3>実地指導の記録にも使えますか？</h3><p>今ある記録を、必要な形で出しやすくします。記録の作り方を施設に押し付けることはしません。</p>
