    <h2>顧客台帳</h2><p>連絡先・履歴・書類を、一画面にまとめます。 「あの書類はどこ？」と探す時間を減らします。</p><h2>期日のお知らせ</h2><p>期限の数日前から、自動で通知します。 届出の出し忘れや期限切れを防ぎます。</p><h2>請求・FAX整理</h2><p>請求書づくりと、届いた書類の振り分け。 手入力と紙探しを減らします。</p><p><a href="/temasui/pro/">てますい 士業版（士業事務所のアシスタント）</a> — 面談記録・顧問先への書類のお願い・お知らせ文・電話メモの下書きと、預かり書類チェック。1か月無料。</p><p><a href="/rk/pro/">士業RK</a> — キーエンスRKで台帳・期日・請求。シナリオ1万円から。</p><p><a href="/pro-dx/">士業DXの提案</a> — 帳票・給与・契約まわりを、今のPCのまま。</p><h3>社労士・税理士の今のExcelのまま始められますか？</h3><p>始められます。様式を作り直すより、今の顧客台帳・請求のファイルに合わせます。実際に動くかどうかは、初回相談の際に画面を見ながら一緒に確認できます。</p><h3>期日通知は、何日前に来ますか？</h3><p>7日前・3日前・当日を基本にします。事務所のやり方に合わせて変えられます。</p><h3>顧問先の名前はサイトに出ますか？</h3><p>お客様の情報を無断で掲載することは一切ございません。ご相談内容も機密情報として厳重にお預かりいたします。</p>
