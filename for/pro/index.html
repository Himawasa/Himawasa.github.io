    <h2>期日が手帳のまま</h2><p>7日前に気づけず、常にどこか不安がある。</p><h2>請求で半日つぶれる</h2><p>件数分のPDF作成とメール添付が、毎月同じ。</p><h2>顧問先の履歴が探せない</h2><p>Excel・Word・紙が分かれ、名前で一発で出ない。</p><p><a href="/pro-dx/">士業DXの提案</a> — 帳票・給与・契約まわりを、今のPCのまま。</p><p><a href="/sharoushi-portal/">社労士ポータル</a> — 事務所と顧問先をつなぐ、13の画面。</p><h3>社労士・税理士の今のExcelのまま始められますか？</h3><p>始められます。様式を作り直すより、今の顧客台帳・請求のファイルに合わせます。動くかは、相談のときに一緒に確認できます。</p><h3>期日通知は、何日前に来ますか？</h3><p>7日前・3日前・当日を基本にします。事務所のやり方に合わせて変えられます。</p><h3>顧問先の名前はサイトに出ますか？</h3><p>出しません。掲載は許可をいただいた範囲だけです。相談の内容も、許可なく第三者に渡しません。</p>
