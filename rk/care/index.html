    <h2>介護のRKは、勤怠ソフトと、施設のExcel様式を行き来するソフトです</h2><p>RKが覚えるのは、KING OF TIMEなどの勤怠から数字を出し、今使っているシフト表へ載せる操作です。記録システムから月末の実績表へ転記する、申し送りの決まった項目を写す、も同じ型です。</p><p>自分で組む壁は、シフトExcelが「所長の様式」で、列が現場ごとに違うこと。勤怠の画面は毎月同じなのに、ナビで再現するのが面倒なことです。</p><p>毎月 / 勤怠ソフトの勤務データ / 施設指定のシフトExcelへ。手入力の残業を減らす</p><p>毎日 / 記録・申し送りの画面 / 決まった項目だけ、決まった用紙へ写す</p><p>月末 / 実績・請求の元データ / 実地指導の前に揃えたい1枚を、夜に作る</p><p>夜勤帯 / 空いている事務PC / 職員が帰ったあとに集計を回す</p><h2>シフト表への転記</h2><p>勤怠データを、今のExcel様式へ。様式は変えません。RKが覚えるのは、出す・貼る・体裁を整える、までです。 手入力の残業を減らす。</p><h2>記録・申し送りの転記</h2><p>決まった項目だけ写します。文章を考えさせる仕事は、RKに向きません。 「どこに書いた？」を減らす。</p><h2>請求・実績のまとめ</h2><p>月末に残る集計を、夜間実行へ。実地指導の前に、数字を揃えやすくします。 介護RKの相談は、この1枚から。</p><p>勤怠は何を使っていますか。CSVは出せますか。</p><p>シフトのExcelは、何行何列で、誰が守っている様式ですか。</p><p>月末に残るのは、実績ですか。請求ですか。何時間ですか。</p><p>記録ソフトは、見られる画面まで共有できますか。</p><p>RKシナリオ作成代行 10,000円から。運用保守代行 5,000円から／月。</p><h3>職員が自分で直す必要はありますか？</h3><p>なくても大丈夫です。作成代行のあとは、止まったら戻す保守を選べます。</p><h3>KING OF TIME以外でもできますか？</h3><p>出せる画面かCSVがあればできます。ソフトの名前より、今の操作順を見せてください。</p><h3>料金の目安は？</h3><p>作成代行は1万円から。保守は月5,000円から。シフト1本からで大丈夫です。</p>
