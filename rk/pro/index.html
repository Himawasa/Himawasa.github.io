    <h2>顧客台帳の更新</h2><p>連絡先と履歴を、今のExcel・ソフトへ。探す時間を減らします。 「どこにあった？」を減らす。</p><h2>期日リストの作成</h2><p>期限の一覧を、決まったタイミングで出す。通知の中身は事務所のやり方に合わせます。 うっかりの手前まで自動化。</p><h2>請求・帳票の作成補助</h2><p>件数分のPDF作成や、届いた書類の振り分けをRKに寄せます。 士業RKの相談は、請求の一本から。</p><p>シナリオ作成 10,000円から。保守 5,000円から／月。</p><h3>顧問先のデータを預かりますか？</h3><p>原則、画面共有の範囲だけ見ます。ファイルが必要なときは範囲と期間を決めて、終わったら消します。名前はサイトに出しません。</p><h3>今のExcelのまま始められますか？</h3><p>始められます。様式を作り直すより、今の顧客台帳と請求のファイルに合わせます。</p><h3>キーエンスの無償サポートだけで足りる場合は？</h3><p>それで進むなら、それが一番です。足りなくなった一本だけを依頼してください。</p>
