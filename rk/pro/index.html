    <h2>士業のRKは、顧問先リストと、請求・届出の画面を行き来するソフトです</h2><p>RKが覚えるのは、顧客台帳Excel（または事務所ソフト）から件数分の請求PDFを作る操作、期日一覧を出す操作、給与ソフトや電子申請の定型画面を開く操作です。命令文が日本語のまま残るので、引継ぎの手順書にもなります。</p><p>自分で組む壁は、顧問先ごとにフォルダが違い、ファイル名規則が頭の中にしかないこと。請求の添付と個別メールが、毎月半日つぶれることです。</p><p>毎月 / 顧客リスト・請求ソフト / 件数分のPDF作成、保存先、名前規則まで</p><p>週次 / 台帳と手帳・Excelの期日 / 届出・申請の一覧を、決まったタイミングで出す</p><p>入金・更新 / 届いたFAXやPDF / 顧問先フォルダへ振り分けるためのリネーム</p><p>給与・手続き / 給与ソフトや申請ポータル / 毎回同じ画面遷移と、数字の転記</p><h2>顧客台帳の更新と参照</h2><p>連絡先と履歴を、今のExcel・ソフトへ。探す時間を減らします。新規の判断は人です。 「どこにあった？」を減らす。</p><h2>届出・申請の一覧</h2><p>期限の一覧を、決まったタイミングで出す。通知文面は事務所の言い方に合わせます。 うっかりの手前まで。確認は人。</p><h2>請求PDFと振り分け</h2><p>件数分の作成、保存、名前。届いた書類の振り分け補助。送信ボタンを押すかは、事務所が決めます。 士業RKの相談は、請求の一本から。</p><p>請求は何件で、何のソフトから出していますか。</p><p>顧問先フォルダの名前規則は、文書にありますか。</p><p>期日は手帳ですか。Excelですか。何日前に見ますか。</p><p>画面共有で見せられる範囲は、どこまでですか。顧問先名は出さなくてよいです。</p><p>RKシナリオ作成代行 10,000円から。運用保守代行 5,000円から／月。</p><h3>顧問先のデータを預かりますか？</h3><p>原則、画面共有の範囲だけ見ます。ファイルが必要なときは範囲と期間を決めて、終わったら消します。名前はサイトに出しません。</p><h3>e-Govや役所サイトの操作も覚えられますか？</h3><p>毎回同じ画面なら、覚えられます。認証や毎回違う入力は向きません。操作を見て切ります。</p><h3>キーエンスの無償サポートだけで足りる場合は？</h3><p>それで進むなら、それが一番です。足りなくなった一本だけを依頼してください。</p>
