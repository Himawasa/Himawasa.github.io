    <h2>病院のRKは、カルテとExcelのあいだの定型操作を覚えるソフトです</h2><p>RKが覚えるのは、電子カルテや医事ソフトから統計CSVを出し、日計・レセプトまわりの指定Excelへ載せる操作です。端末が空いている夜に回し、人が朝に確認します。</p><p>自分で組む壁は、カルテの出力画面が深く、項目のチェックを毎回忘れること。複数病院の「野良Excel」を一つに合わせる作業が、担当の頭の中にしかないことです。</p><p>18時以降 / 電子カルテの統計・出力画面 / CSVを保存し、決まったフォルダとファイル名にする</p><p>翌朝まで / 出したCSV / 日計表・収入集計のExcelへ転記。確認は医事の人</p><p>毎日 / 複数病院・複数科のExcel / 本部の統一様式へ統合。どれが最新かを探さない</p><p>起動時 / パスワードとアプリ起動 / 人が来る前に、集計用の画面まで進めておく</p><h2>電子カルテからの抜き出し</h2><p>人が待たない時間にCSVを取る。カルテの中の診療記録ではなく、現場が出している統計の範囲だけです。 日計のための残業を、先に外す。</p><h2>日計・レセプトまわりの集計</h2><p>収入に関わる数字の転記をRKへ。金額の確定と点検は、人のままです。 ボタン待ちの空き時間をなくす。</p><h2>複数拠点のExcel統合</h2><p>病院ごと・科ごとのファイルを、一つの様式へ。野良ファイルを増やしません。 病院RKの相談は、この統合からで足ります。</p><p>統計の出力権限は、医事ですか。情報ですか。夜間にそのIDを使ってよいですか。</p><p>日計のExcelは、何枚で、誰の様式ですか。</p><p>カルテが空く時間帯は、何時から何時ですか。</p><p>拠点が複数なら、列のズレは手で直していますか。</p><p>RKシナリオ作成代行 10,000円から。運用保守代行 5,000円から／月。</p><h3>電子カルテの中まで触れますか？</h3><p>触れません。現場が見せられる出力画面と、保存したCSVの範囲だけです。患者さんの記録を読む作業はしません。</p><h3>個人情報の扱いは？</h3><p>画面共有の範囲を先に決めます。作業用のコピーが要るときは期間を区切り、終わったら消します。許可なく第三者に渡しません。</p><h3>公開されている病院事例と同じ時間は減りますか？</h3><p>保証しません。今の日計と出力画面を見て、同じ型で作れるかを相談で切ります。</p>
