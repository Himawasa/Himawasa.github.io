    <h2>電子カルテからの抜き出し</h2><p>端末が空いている時間にCSVを取り、決まったExcelへ。人が待たない前提です。 日計の心理的負担を減らす。</p><h2>日計・レセプトまわりの集計</h2><p>収入に関わる数字の転記を、RKのシナリオにします。確認は人のままです。 ボタン待ちの空き時間をなくす。</p><h2>複数拠点のExcel統合</h2><p>病院ごと・科ごとのファイルを、一つの様式へ。野良ファイルを増やしません。 病院RKの相談は、集計の一本から。</p><p>シナリオ作成 10,000円から。保守 5,000円から／月。</p><h3>電子カルテの中まで触れますか？</h3><p>カルテの中身を勝手に見ることはしません。現場が見せられる画面操作と、出力したCSVの範囲だけです。</p><h3>個人情報の扱いは？</h3><p>相談内容もデータも、許可なく第三者に渡しません。作業用のコピーが要るときは、その場で範囲を決めます。</p><h3>キーエンスの病院事例と同じことはできますか？</h3><p>公開事例と同じ数字は保証しません。今の帳票を見て、同じ型で作れるかを相談で確認します。</p>
