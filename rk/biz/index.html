    <h2>中小企業のRKは、帳票・Web・Excelの往復を覚えるソフトです</h2><p>RKが覚えるのは、PDFや発注サイトの数字を、今の売上Excelへ貼る操作です。毎週同じ集計を出し、決まった宛先にメールする。見積の型に数字を流し込む。担当が休んでも、同じ手順が残ります。</p><p>自分で組む壁は、「どれが最新のExcelか」が人の頭にあり、シナリオにする対象が決まらないことです。毎日30分の転記は、情シス案件に見えない。だからナビの途中で放置されます。</p><p>毎日 / PDF・Webの受注／請求 / 今の管理Excelへ転記。列は今のまま</p><p>毎週 / 売上や在庫のシート / 決まった集計を出し、決まった宛先へメール</p><p>見積のとき / 単価表と数量 / いつもの見積様式へ流し込む</p><p>朝 / 共有フォルダ / 最新版以外を触らない、名前規則で揃える</p><h2>帳票の転記</h2><p>PDFやWebの表を、今のExcelへ。RKが覚えるのは、開く・選ぶ・貼る、です。読み取り不能なスキャンは向きません。 転記ミスと残業を減らす。</p><h2>集計と定型メール</h2><p>同じ集計、同じ宛先。担当が変わっても回る形にします。文面の判断は人です。 中小企業RKは、この一本から。</p><h2>最新版が分かる状態</h2><p>名前規則と保存先を、RKの手順に含めます。どれが正しいかを会議で探さない。 まずは今のフォルダを見せてください。</p><p>毎日の転記は、何の画面（またはPDF）から、どのExcelの何列へですか。</p><p>週次メールは、誰が、何時に、何を添付していますか。</p><p>最新版が分からなくなるファイルは、どれですか。</p><p>見積は型がありますか。単価はどこにありますか。</p><p>RKシナリオ作成代行 10,000円から。運用保守代行 5,000円から／月。</p><h3>社員が数人でも頼めますか？</h3><p>頼めます。毎日の転記1本と、月5,000円の保守からで大丈夫です。</p><h3>Excelを捨てますか？</h3><p>捨てません。今の帳票を活かして、転記だけを短くします。</p><h3>読めないPDFでもできますか？</h3><p>文字として選べるものなら、RKで覚えられます。画像だけのスキャンは、相談のときに切ります。</p>
