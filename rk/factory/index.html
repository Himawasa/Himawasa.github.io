    <h2>工場のRKは、測定値と実績を、指定のExcelへ移すソフトです</h2><p>RKが覚えるのは、品質端末・生産管理・社内発注の画面と、本社指定のExcel様式を行き来する操作です。人が毎回同じ順でコピーしているなら、夜中に回せます。</p><p>自分でシナリオを組む壁は、だいたいここです。試験ソフトの項目名と、報告書の列が一致しない。グラフの系列を手で直している。発注画面のタブ順を覚えるのが面倒。</p><p>試験のあと / 測定器・品質ソフトのCSV / 画面 / 指定の報告書Excelへ貼り、決まったグラフまで作る</p><p>毎日・毎週 / 生産管理・現場端末の実績 / 本社様式の資料化。人が見るのは数字の確認だけ</p><p>発注のとき / 在庫表やメールの数量 / 社内発注画面への入力と、控えの保存</p><p>夜 / 空いている事務所PC / 翌日朝に、たたき台のファイルが置いてある状態にする</p><h2>試験データのグラフ化</h2><p>測定値を報告書へ載せ、系列と体裁まで。手でグラフを直す時間を、RKの手順にします。 朝来たら、確認用のたたき台がある。</p><h2>実績の資料化</h2><p>現場端末や基幹から出した数字を、本社が求める1枚に。転記ミスで後工程が止まるのを減らします。 人が見るのは、確認だけ。</p><h2>社内発注・在庫の転記</h2><p>在庫表と発注画面の往復。タブの順番ごと覚えるのが面倒なら、そこが一本目です。 工場RKの相談は、ここからで足ります。</p><p>試験データは、どのソフトの、どの画面から出ますか。</p><p>報告書のExcelは、誰が作った様式ですか。列を変えてよいですか。</p><p>夜間に、そのPCを占有できますか。ログインは自動でよいですか。</p><p>社内発注は、数量のコピーだけですか。承認のクリックまで含めますか。</p><p>RKシナリオ作成代行 10,000円から。運用保守代行 5,000円から／月。</p><h3>検査機やPLCの中まで触れますか？</h3><p>触れません。人が今、画面やCSVで出している範囲だけです。出せない数字は、出せる形にしてからRKに覚えさせます。</p><h3>他工場へ同じシナリオを配れますか？</h3><p>様式と画面が同じなら、コピーできます。違うソフト、違う列なら、一本目を安定させてから横展開します。</p><h3>夜間にエラーで止まったら？</h3><p>朝見て戻す前提の保守を選べます。止まったログの見方も、短く残します。</p>
