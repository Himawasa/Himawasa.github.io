    <h2>RKは、人がパソコンで繰り返している操作を覚えるソフトです</h2><p>キーエンスのRKシリーズは、RPA（Robotic Process Automation）です。マウスとキーボードの操作を覚え、Excel・ブラウザ・業務ソフトをまたいで、同じ手順を代行します。夜間など、決まった時刻に回すこともできます。</p><p>ナビとメーカーのカスタマーサクセスは付きます。それでも、シナリオ作成の画面は多く、勝手も悪い。何を一本目にするかで手が止まる人が多いです。</p><p>私たちはライセンスは売りません。今やっている操作を見せてもらい、シナリオの作成代行と、止まったあとの復帰だけを受けます。</p><h2>何を自動化するか</h2><p>毎日残っている手作業を聞いて、RKが覚えられる手順かどうかを切ります。道具の名前から始めません。 「何を頼めばいいか分からない」で大丈夫です。</p><h2>作成代行 1万円から</h2><p>自分でナビを押し続ける必要はありません。いつもの操作を画面共有で見せてください。こちらでシナリオにします。 CSが付いていても、作る手間は残ります。</p><h2>保守 5,000円から</h2><p>画面の位置が変わって止まる、ボタン名が変わる。RKはそこで落ちます。戻す前提で見ます。 作って終わりにしません。</p><p>作成代行 10,000円から。保守 5,000円から／月。</p><h3>メーカーのカスタマーサクセスでは足りませんか？</h3><p>足りる現場もあります。案内は付いていても、自分でシナリオを組むのは面倒、画面の勝手が悪い、手が止まる、という相談を受けます。作成代行だけでも頼めます。</p><h3>RKでできない作業はありますか？</h3><p>あります。毎回判断が違うもの、紙を見て考える入力は向きません。相談の最初に「覚えられる手順か」を切ります。</p><h3>RKのライセンスも売れますか？</h3><p>売れません。契約はキーエンスへお願いします。作成代行と保守だけです。</p><h3>RK以外の自動化も頼めますか？</h3><p>まずは今のRKの作業だけ聞かせてください。必要なものがあれば、そのあと提案します。最初から別の道具の話はしません。</p>
